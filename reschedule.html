<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reschedule Booking — Junk Relief LLC</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root { --black:#0a0a0a; --red:#E31212; --blue:#3a9bdc; --white:#f5f5f0; --gray:#1a1a1a; --mid:#2a2a2a; --muted:#888; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--black);color:var(--white);font-family:'Barlow',sans-serif;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(-45deg,transparent,transparent 60px,rgba(227,18,18,0.02) 60px,rgba(227,18,18,0.02) 61px);pointer-events:none}
  header{position:relative;z-index:10;background:rgba(10,10,10,0.98);border-bottom:2px solid var(--red);padding:1.2rem 2.5rem;display:flex;justify-content:space-between;align-items:center}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;text-decoration:none;color:var(--white)}
  .logo span{color:var(--red)}
  main{position:relative;z-index:10;max-width:580px;margin:0 auto;padding:4rem 2rem}

  .card{background:var(--gray);border:1px solid #222;border-top:3px solid var(--blue);margin-bottom:1rem}
  .card-body{padding:1.5rem}
  h1{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:2px;margin-bottom:0.5rem}
  .subtitle{color:var(--muted);font-size:0.95rem;line-height:1.6;margin-bottom:1.5rem}

  .data-row{display:flex;justify-content:space-between;padding:0.55rem 0;border-bottom:1px solid #1e1e1e;font-size:0.9rem}
  .data-row:last-child{border-bottom:none}
  .data-label{font-size:0.68rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding-top:0.15rem}
  .data-val{font-weight:600;color:var(--white)}

  label{display:block;font-size:0.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem}
  input[type="date"],select{width:100%;background:var(--black);border:1px solid #333;color:var(--white);font-size:1rem;padding:0.75rem 0.9rem;font-family:'Barlow',sans-serif}
  .form-row{margin-bottom:1.25rem}

  .policy-box{background:#111;border-left:3px solid #333;padding:1rem 1.2rem;margin:1rem 0;font-size:0.85rem;color:var(--muted);line-height:1.7}
  .policy-box strong{color:var(--white)}
  .policy-box.eligible{border-left-color:#4caf50}
  .policy-box.not-eligible{border-left-color:var(--red)}

  .btn{width:100%;padding:1rem;font-family:'Barlow',sans-serif;font-weight:900;font-size:0.95rem;letter-spacing:1.5px;text-transform:uppercase;border:none;cursor:pointer;transition:opacity 0.2s,transform 0.1s;margin-top:0.75rem}
  .btn:hover{opacity:0.9;transform:translateY(-1px)}
  .btn-blue{background:var(--blue);color:#fff}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

  #result{display:none;text-align:center;padding:2rem}
  #result .result-icon{font-size:3.5rem;margin-bottom:1rem}
  #result h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;margin-bottom:0.75rem}
  #result p{color:var(--muted);font-size:0.95rem;line-height:1.6}
  #result a{color:var(--red);font-weight:700;text-decoration:none}

  .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:0.5rem}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:768px){
    input[type="date"],select{font-size:16px!important}
  }
</style>
</head>
<body>
<header>
  <a href="/" class="logo">Junk <span>Relief</span></a>
  <a href="tel:9315610431" style="color:var(--muted);font-weight:700;font-size:0.85rem;text-decoration:none">📞 (931) 561-0431</a>
</header>

<main>
  <div id="resched-form">
    <h1>Reschedule Booking</h1>
    <p class="subtitle">Pick a new day and time for your junk removal appointment.</p>

    <div class="card">
      <div class="card-body">
        <div class="data-row"><span class="data-label">Name</span><span class="data-val" id="c-name">—</span></div>
        <div class="data-row"><span class="data-label">Current Date</span><span class="data-val" id="c-date">—</span></div>
        <div class="data-row"><span class="data-label">Current Time</span><span class="data-val" id="c-time">—</span></div>
      </div>
    </div>

    <div class="policy-box" id="policy-box">Checking eligibility…</div>

    <div class="card" id="picker-card">
      <div class="card-body">
        <div class="form-row">
          <label>New Date <span style="color:#666;font-weight:400;text-transform:none;letter-spacing:0">(Tuesday–Friday)</span></label>
          <input type="date" id="new-date" onchange="loadSlots()">
        </div>
        <div class="form-row" style="margin-bottom:0.5rem">
          <label>New Start Time</label>
          <select id="new-time"><option value="">Pick a date first</option></select>
        </div>
        <button class="btn btn-blue" id="resched-btn" onclick="confirmReschedule()">Reschedule My Booking</button>
      </div>
    </div>
  </div>

  <div id="result">
    <div class="result-icon" id="result-icon">✅</div>
    <h2 id="result-title">Rescheduled</h2>
    <p id="result-msg"></p>
    <a href="/" style="display:inline-block;margin-top:1.5rem;color:var(--red);font-weight:700">← Back to Junk Relief</a>
  </div>
</main>

<script>
  const p = new URLSearchParams(window.location.search);
  const token    = p.get('token')    || '';
  const dateKey  = p.get('dateKey')  || '';
  const startHr  = parseInt(p.get('startHr') || '8');
  const bookingId= p.get('bookingId')|| '';
  const stripeId = p.get('stripeId') || '';
  const name     = p.get('name')     || '—';
  const date     = p.get('date')     || dateKey;
  const time     = p.get('time')     || '—';

  document.getElementById('c-name').textContent = name;
  document.getElementById('c-date').textContent = date;
  document.getElementById('c-time').textContent = time;

  // Duration is inferred from the current booking once we load all bookings.
  let jobDuration = 2;
  let allBookings = {}; // {dateKey:[{startHr,endHr,...}]}

  // 24-hour cutoff check (mirrors cancel + server rule)
  const apptDate = new Date(`${dateKey}T${String(startHr).padStart(2,'0')}:00:00`);
  const hoursUntil = (apptDate - new Date()) / (1000 * 60 * 60);
  const eligible = hoursUntil >= 24;
  const policyBox = document.getElementById('policy-box');

  if (!eligible) {
    policyBox.className = 'policy-box not-eligible';
    policyBox.innerHTML = `⚠️ <strong>Online rescheduling is closed.</strong> Your appointment is less than 24 hours away. Please call <a href="tel:9315610431" style="color:var(--red)">(931) 561-0431</a> and we'll move it for you.`;
    document.getElementById('picker-card').style.display = 'none';
  } else {
    policyBox.className = 'policy-box eligible';
    policyBox.innerHTML = `✅ You can reschedule online up to 24 hours before your appointment. Choose a new Tuesday–Friday slot below.`;
    loadAllBookings();
  }

  function fmtHr(hr){
    const s = hr>=12?'PM':'AM';
    const h = hr>12?hr-12:hr===0?12:hr;
    return `${h}:00 ${s}`;
  }

  async function loadAllBookings() {
    try {
      const res = await fetch('/.netlify/functions/bookings');
      allBookings = await res.json();
      // Infer this booking's duration from its current slot
      const day = allBookings[dateKey] || [];
      const me = bookingId
        ? day.find(b => b.bookingId === bookingId)
        : day.find(b => b.stripeId === stripeId) || day.find(b => b.startHr === startHr);
      if (me && me.endHr) jobDuration = (me.endHr - me.startHr) || 2;
    } catch(e) {
      allBookings = {};
    }
  }

  function loadSlots() {
    const sel = document.getElementById('new-time');
    const dk = document.getElementById('new-date').value;
    if (!dk) { sel.innerHTML = '<option value="">Pick a date first</option>'; return; }

    // Tue–Fri only
    const dow = new Date(`${dk}T12:00:00`).getDay();
    if (![2,3,4,5].includes(dow)) {
      sel.innerHTML = '<option value="">Closed — choose Tue–Fri</option>';
      return;
    }

    const taken = (allBookings[dk] || [])
      .filter(b => !(bookingId ? b.bookingId === bookingId : (b.stripeId === stripeId)))
      .map(b => [b.startHr, b.endHr]);

    const starts = [8,9,10,11,12,13,14,15,16];
    const opts = [];
    for (const h of starts) {
      const end = h + jobDuration;
      if (end > 18) continue;
      const clash = taken.some(([bs,be]) => h < be && end > bs);
      if (clash) continue;
      opts.push(`<option value="${h}">${fmtHr(h)} – ${fmtHr(end)}</option>`);
    }
    sel.innerHTML = opts.length
      ? '<option value="">Select a time…</option>' + opts.join('')
      : '<option value="">No open times this day</option>';
  }

  async function confirmReschedule() {
    const newDateKey = document.getElementById('new-date').value;
    const newStartHr = parseInt(document.getElementById('new-time').value);
    if (!newDateKey || isNaN(newStartHr)) {
      alert('Please pick a new date and time.');
      return;
    }
    const btn = document.getElementById('resched-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Rescheduling…';

    try {
      const res = await fetch('/.netlify/functions/reschedule-booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          via: 'customer',
          token, stripeId,
          oldDateKey: dateKey,
          bookingId,
          newDateKey, newStartHr
        })
      });
      const data = await res.json();

      document.getElementById('resched-form').style.display = 'none';
      const result = document.getElementById('result');
      result.style.display = 'block';

      if (res.ok && data.success) {
        document.getElementById('result-icon').textContent = '✅';
        document.getElementById('result-title').textContent = 'All Set!';
        document.getElementById('result-msg').innerHTML =
          (data.message || 'Your appointment has been rescheduled.') +
          `<br><br>A confirmation has been emailed to you.<br><br>Questions? Call <a href="tel:9315610431">(931) 561-0431</a>.`;
      } else {
        document.getElementById('result-icon').textContent = '❌';
        document.getElementById('result-title').textContent = 'Couldn\'t Reschedule';
        document.getElementById('result-msg').innerHTML =
          (data.error || 'Something went wrong.') +
          `<br><br>Please call <a href="tel:9315610431">(931) 561-0431</a> and we'll help.`;
      }
    } catch(err) {
      document.getElementById('resched-form').style.display = 'none';
      const result = document.getElementById('result');
      result.style.display = 'block';
      document.getElementById('result-icon').textContent = '❌';
      document.getElementById('result-title').textContent = 'Error';
      document.getElementById('result-msg').innerHTML =
        'Could not reschedule. Please call <a href="tel:9315610431">(931) 561-0431</a>.';
    }
  }
</script>
</body>
</html>
